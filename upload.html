<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Stamp</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

header{
background:#003366;
color:white;
padding:15px;
text-align:center;
}

.container{
width:500px;
margin:40px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h2{
text-align:center;
margin-bottom:20px;
color:#003366;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,select,textarea{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:5px;
}

textarea{
height:100px;
resize:none;
}

button{
width:100%;
padding:12px;
margin-top:20px;
background:#0077cc;
color:white;
border:none;
border-radius:5px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#005fa3;
}

#msg{
text-align:center;
margin-top:15px;
color:green;
font-weight:bold;
}

</style>

</head>
<body>

<header>
<h1>Upload Stamp</h1>
</header>

<div class="container">

<h2>Add New Stamp</h2>

<form id="uploadForm">

<label>Stamp Name</label>
<input type="text" id="stampName" required>

<label>Country</label>
<input type="text" id="country" required>

<label>Year</label>
<input type="number" id="year" required>

<label>Category</label>
<select id="category">
<option>Historical</option>
<option>Wildlife</option>
<option>Sports</option>
<option>Culture</option>
<option>Other</option>
</select>

<label>Description</label>
<textarea id="description"></textarea>

<label>Image URL</label>
<input type="text" id="image" placeholder="Paste image URL">

<button type="submit">Upload Stamp</button>

</form>

<p id="msg"></p>

</div>

<script>

document.getElementById("uploadForm").addEventListener("submit",function(e){

e.preventDefault();

let stamp={
name:document.getElementById("stampName").value,
country:document.getElementById("country").value,
year:document.getElementById("year").value,
category:document.getElementById("category").value,
description:document.getElementById("description").value,
image:document.getElementById("image").value
};

let stamps=JSON.parse(localStorage.getItem("stamps")) || [];

stamps.push(stamp);

localStorage.setItem("stamps",JSON.stringify(stamps));

document.getElementById("msg").innerHTML="✅ Stamp Uploaded Successfully";

document.getElementById("uploadForm").reset();

setTimeout(function(){
window.location.href="gallery.html";
},1000);

});

</script>

</body>
</html>
