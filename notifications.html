<!DOCTYPE html>
<html>
<head>
<title>Notifications</title>

<style>

body{
font-family:Arial;
background:#f4f6f9;
margin:0;
}

header{
background:#003366;
color:white;
padding:15px;
text-align:center;
}

.container{
width:80%;
margin:30px auto;
}

.notification{
background:white;
padding:20px;
margin-bottom:15px;
border-left:5px solid #0077cc;
box-shadow:0 3px 10px rgba(0,0,0,.2);
border-radius:5px;
}

</style>

</head>

<body>

<header>
<h1>Notifications</h1>
</header>

<div class="container">

<div class="notification">
📮 New stamp uploaded successfully.
</div>

<div class="notification">
💬 Someone commented on your discussion.
</div>

<div class="notification">
👍 Your stamp received a like.
</div>

<div class="notification">
🎉 Welcome to National Web Community of Philatelists.
</div>

</div>

</body>
</html>
