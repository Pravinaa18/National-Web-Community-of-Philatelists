<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discussion Forum</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

header{
background:#003366;
color:white;
padding:15px;
text-align:center;
}

.container{
width:80%;
max-width:800px;
margin:30px auto;
}

form{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
margin-bottom:30px;
}

input,textarea{
width:100%;
padding:10px;
margin-top:10px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:5px;
}

textarea{
height:100px;
resize:none;
}

button{
background:#0077cc;
color:white;
padding:10px 20px;
border:none;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#005fa3;
}

.post{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.post h3{
color:#003366;
margin-bottom:10px;
}

.post p{
margin-bottom:15px;
color:#444;
}

.actions button{
margin-right:10px;
}

</style>

</head>
<body>

<header>
<h1>Discussion Forum</h1>
</header>

<div class="container">

<form id="forumForm">

<h2>Ask a Question</h2>

<input type="text" id="title" placeholder="Enter Question Title" required>

<textarea id="description" placeholder="Write your discussion here..." required></textarea>

<button type="submit">Post Discussion</button>

</form>

<div id="posts"></div>

</div>

<script>

let posts = JSON.parse(localStorage.getItem("posts")) || [];

function displayPosts(){

let output = "";

if(posts.length === 0){
output = "<h3>No Discussions Yet.</h3>";
}else{

posts.forEach(function(post,index){

output += `
<div class="post">

<h3>${post.title}</h3>

<p>${post.description}</p>

<div class="actions">
<button onclick="likePost(${index})">👍 Like</button>
<button onclick="commentPost()">💬 Comment</button>
</div>

</div>
`;

});

}

document.getElementById("posts").innerHTML = output;

}

displayPosts();

document.getElementById("forumForm").addEventListener("submit",function(e){

e.preventDefault();

let title = document.getElementById("title").value;
let description = document.getElementById("description").value;

posts.push({
title:title,
description:description
});

localStorage.setItem("posts",JSON.stringify(posts));

document.getElementById("forumForm").reset();

displayPosts();

});

function likePost(index){

alert("👍 You liked this discussion!");

}

function commentPost(){

let comment = prompt("Enter your comment:");

if(comment){
alert("Comment Added Successfully!");
}

}

</script>

</body>
</html>
