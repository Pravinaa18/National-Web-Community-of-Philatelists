<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stamp Gallery</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
}

header{
background:#003366;
color:white;
padding:15px;
text-align:center;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
padding:30px;
}

.card{
background:white;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
overflow:hidden;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card-content{
padding:15px;
}

.card-content h3{
color:#003366;
margin-bottom:10px;
}

.card-content p{
margin:6px 0;
color:#555;
}

.btns{
display:flex;
justify-content:space-between;
margin-top:15px;
}

button{
padding:10px 15px;
border:none;
border-radius:5px;
cursor:pointer;
color:white;
}

.like{
background:#28a745;
color:#bedac4;

}

.comment{
background:#0077cc;
color:#7691a5
}

.delete{
background:#060f3b;
color:#868daf;
}
.empty{
text-align:center;
margin-top:80px;
font-size:22px;
color:gray;
}

</style>

</head>
<body>

<header>
<h1>Stamp Gallery</h1>
</header>

<div class="container" id="gallery"></div>

<p class="empty" id="empty"></p>

<script>

let stamps = JSON.parse(localStorage.getItem("stamps")) || [];

let gallery = document.getElementById("gallery");

if(stamps.length==0){

document.getElementById("empty").innerHTML="No Stamps Uploaded Yet.";

}else{

stamps.forEach(function(stamp, index){

gallery.innerHTML += `

<div class="card">

<img src="${stamp.image }"alt="${stamp.title}">

<div class="card-content">

<h3>${stamp.name}</h3>

<p><b>Country:</b> ${stamp.country}</p>

<p><b>Year:</b> ${stamp.year}</p>

<p><b>Category:</b> ${stamp.category}</p>

<p>${stamp.description}</p>

<div class="btns">
    <button class="like" onclick="likeStamp(${index})">👍 Like</button>

    <button class="comment" onclick="commentStamp(${index})">💬 Comment</button>

    <button class="delete" onclick="deleteStamp(${index})">🗑 Delete</button>
</div>

</div>

</div>

`;

});

}
function likeStamp(index){
    alert("Liked!");
}

function commentStamp(index){
    let comment = prompt("Enter your comment:");
    if(comment){
        alert("Comment Added: " + comment);
    }
}

function deleteStamp(index){
    let stamps = JSON.parse(localStorage.getItem("stamps")) || [];

    if(confirm("Delete this stamp?")){
        stamps.splice(index,1);
        localStorage.setItem("stamps", JSON.stringify(stamps));
        location.reload();
    }
}

</script>

</body>
</html>
