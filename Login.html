<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | National Web Community of Philatelists</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

.container{
width:380px;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 10px 20px rgba(0,0,0,.3);
}

h2{
text-align:center;
color:#003366;
margin-bottom:10px;
}

p{
text-align:center;
color:gray;
margin-bottom:25px;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input{
width:100%;
padding:12px;
margin-top:8px;
border:1px solid #ccc;
border-radius:8px;
outline:none;
}

input:focus{
border-color:#0077cc;
}

button{
width:100%;
padding:13px;
margin-top:25px;
background:#0077cc;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#005fa3;
}

.register{
text-align:center;
margin-top:20px;
}

.register a{
text-decoration:none;
color:#0077cc;
font-weight:bold;
}

.message{
text-align:center;
margin-top:15px;
font-weight:bold;
color:green;
}

</style>

</head>
<body>

<div class="container">

<h2>Login</h2>

<p>National Web Community of Philatelists</p>

<form id="loginForm">

<label>Email</label>
<input type="email" id="email" placeholder="Enter Email" required>

<label>Password</label>
<input type="password" id="password" placeholder="Enter Password" required>

<button type="submit">Login</button>

</form>

<div class="message" id="msg"></div>

<div class="register">
Don't have an account?
<a href="register.html">Register</a>
</div>

</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e){

    e.preventDefault();

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    let user = JSON.parse(localStorage.getItem("user"));

    if(user && email === user.email && password === user.password){
        alert("Login Successful ✅");
        window.location.replace("dashboard.html");
    } else {
        alert("Invalid Email or Password ❌");
    }

});
function logout(){

    localStorage.removeItem("user");

    window.location.replace("login.html");

}
</script>

</body>
</html>
